name: Foundation Terraform AKS

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "Ação permitida para a foundation"
        required: true
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    environment: hml
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - uses: azure/login@v2
        if: vars.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Planejar foundation
        if: vars.AZURE_CLIENT_ID != ''
        env:
          TF_VAR_state_resource_group_name: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_VAR_state_storage_account_name: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_VAR_resource_name_suffix: ${{ vars.RESOURCE_NAME_SUFFIX }}
        run: |
          terraform -chdir=foundation init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_AKS_CONTAINER }}" \
            -backend-config="key=foundation.tfstate" \
            -backend-config="use_azuread_auth=true"
          terraform -chdir=foundation plan -input=false -out=foundation.tfplan
      - name: Aplicar foundation após aprovação de custo
        if: inputs.acao == 'apply' && vars.TF_APPLY_ENABLED == 'true' && vars.AZURE_CLIENT_ID != ''
        run: terraform -chdir=foundation apply -input=false -auto-approve foundation.tfplan
