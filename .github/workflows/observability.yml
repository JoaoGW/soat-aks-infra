name: Observabilidade AKS

on:
  workflow_dispatch:
    inputs:
      acao:
        description: Ação permitida
        required: true
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

jobs:
  observability:
    runs-on: ubuntu-latest
    environment: observability
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_resource_group_name: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_VAR_state_storage_account_name: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_VAR_aks_state_container_name: ${{ vars.TF_STATE_AKS_CONTAINER }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - uses: azure/login@v2
        if: vars.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1
        if: vars.AZURE_CLIENT_ID != ''
        with:
          kubelogin-version: v0.1.4
      - name: Planejar observabilidade
        if: vars.AZURE_CLIENT_ID != ''
        run: |
          terraform -chdir=environments/observability init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_AKS_CONTAINER }}" \
            -backend-config="key=observability.tfstate" \
            -backend-config="use_azuread_auth=true"
          terraform -chdir=environments/observability plan -input=false -out=observability.tfplan -var='secrets_store_crds_ready=false'
      - name: Aplicar após aprovação de custo
        if: inputs.acao == 'apply' && vars.TF_APPLY_ENABLED == 'true' && vars.AZURE_CLIENT_ID != ''
        run: |
          terraform -chdir=environments/observability apply -input=false -auto-approve observability.tfplan
          kubectl wait --for=condition=Established crd/secretproviderclasses.secrets-store.csi.x-k8s.io --timeout=180s
          terraform -chdir=environments/observability apply -input=false -auto-approve -var='secrets_store_crds_ready=true'
