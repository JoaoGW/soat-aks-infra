name: Destroy Terraform AKS

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente a remover"
        required: true
        type: choice
        options: [hml, prod]
      confirmacao:
        description: "Digite DESTRUIR para confirmar"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    if: inputs.confirmacao == 'DESTRUIR'
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - uses: azure/login@v2
        if: vars.TF_DESTROY_ENABLED == 'true' && vars.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1
        if: vars.TF_DESTROY_ENABLED == 'true' && vars.AZURE_CLIENT_ID != ''
        with:
          kubelogin-version: v0.1.4
      - name: Remover configuração do ambiente
        if: vars.TF_DESTROY_ENABLED == 'true' && vars.AZURE_CLIENT_ID != ''
        env:
          TF_VAR_state_resource_group_name: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_VAR_state_storage_account_name: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_VAR_aks_state_container_name: ${{ vars.TF_STATE_AKS_CONTAINER }}
        run: |
          terraform -chdir="environments/${{ inputs.ambiente }}" init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_AKS_CONTAINER }}" \
            -backend-config="key=${{ inputs.ambiente }}.tfstate" \
            -backend-config="use_azuread_auth=true"
          terraform -chdir="environments/${{ inputs.ambiente }}" destroy -input=false -auto-approve
