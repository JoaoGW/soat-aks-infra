name: Deploy Terraform AKS

on:
  push:
    branches: [development, main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy_hml:
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    environment: hml
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - uses: azure/login@v2
        if: vars.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Aplicar homologação após aprovação de custo
        if: vars.TF_APPLY_ENABLED == 'true' && vars.AZURE_CLIENT_ID != ''
        env:
          TF_VAR_state_resource_group_name: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_VAR_state_storage_account_name: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_VAR_aks_state_container_name: ${{ vars.TF_STATE_AKS_CONTAINER }}
          TF_VAR_resource_name_suffix: ${{ vars.RESOURCE_NAME_SUFFIX }}
        run: |
          terraform -chdir=environments/hml init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_AKS_CONTAINER }}" \
            -backend-config="key=hml.tfstate" \
            -backend-config="use_azuread_auth=true"
          terraform -chdir=environments/hml apply -input=false -auto-approve

  deploy_prod:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - uses: azure/login@v2
        if: vars.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Aplicar produção após aprovação de custo
        if: vars.TF_APPLY_ENABLED == 'true' && vars.AZURE_CLIENT_ID != ''
        env:
          TF_VAR_state_resource_group_name: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_VAR_state_storage_account_name: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_VAR_aks_state_container_name: ${{ vars.TF_STATE_AKS_CONTAINER }}
        run: |
          terraform -chdir=environments/prod init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_AKS_CONTAINER }}" \
            -backend-config="key=prod.tfstate" \
            -backend-config="use_azuread_auth=true"
          terraform -chdir=environments/prod apply -input=false -auto-approve
